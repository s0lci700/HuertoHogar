<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi perfil — HuertoHogar</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body data-page="perfil">
    <div data-parcial="header"></div>

    <!-- novalidate: la validación la hace validaciones.js, no el navegador
         (requisito de la EV1). Ver el mismo comentario en login.html. -->
    <main class="formulario-pagina">
        <h1>Mi perfil</h1>
        <p class="txt-secundario">Acá van los datos con los que despachamos tu pedido.</p>

        <p class="form-mensaje" id="perfil-mensaje" role="status"></p>

        <form class="formulario" id="form-perfil" novalidate>
            <div class="campo">
                <label for="perfil-nombre">Nombre completo</label>
                <input type="text" id="perfil-nombre" name="nombre" autocomplete="name"
                    aria-describedby="error-perfil-nombre">
                <p class="error" id="error-perfil-nombre"></p>
            </div>

            <!-- El correo identifica la cuenta, así que se muestra pero no se
                 edita: cambiarlo dejaría al login sin contra qué comparar. -->
            <div class="campo">
                <label for="perfil-email">Correo electrónico</label>
                <input type="email" id="perfil-email" name="email" readonly aria-describedby="ayuda-perfil-email">
                <p class="ayuda txt-secundario" id="ayuda-perfil-email">El correo de la cuenta no se puede cambiar.</p>
            </div>

            <div class="campo">
                <label for="perfil-direccion">Dirección de entrega</label>
                <input type="text" id="perfil-direccion" name="direccion" autocomplete="street-address"
                    aria-describedby="error-perfil-direccion">
                <p class="error" id="error-perfil-direccion"></p>
            </div>

            <div class="campo">
                <label for="perfil-telefono">Número de contacto</label>
                <input type="tel" id="perfil-telefono" name="telefono" autocomplete="tel"
                    aria-describedby="ayuda-perfil-telefono error-perfil-telefono">
                <p class="ayuda txt-secundario" id="ayuda-perfil-telefono">Por ejemplo +56 9 1234 5678.</p>
                <p class="error" id="error-perfil-telefono"></p>
            </div>

            <button type="submit" class="btn btn-primary">Guardar cambios</button>
        </form>
    </main>

    <div data-parcial="footer"></div>

    <script src="js/carrito.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/layout.js"></script>
</body>

</html>
