<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrito — HuertoHogar</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body data-page="carrito">
    <div data-parcial="header"></div>

    <main class="container carrito-pagina">
        <h1>Tu carrito</h1>

        <ul id="lista-carrito" class="carrito-lista">
          <!-- Los items del carrito se mostrarán aquí -->
        </ul>

        <!-- renderizarCarrito() muestra este párrafo y esconde #resumen-carrito
             cuando el carrito está vacío, y al revés cuando tiene items. -->
        <p id="carrito-vacio" class="carrito-vacio">
          Tu carrito está vacío. <a href="productos.html">Ver los productos</a>.
        </p>

        <div id="resumen-carrito" class="carrito-resumen">
          <p class="carrito-total">Total: <span id="total-carrito">0</span></p>
          <div class="carrito-acciones">
            <button id="btn-vaciar" class="btn">Vaciar carrito</button>
            <button id="btn-confirmar" class="btn btn-primary">Confirmar pedido</button>
          </div>
        </div>

        <!-- confirmarPedido() pinta acá la boleta y saca el hidden. -->
        <section id="comprobante" class="comprobante" aria-live="polite" hidden></section>
    </main>

    <div data-parcial="footer"></div>

    <script src="js/carrito.js"></script>
    <script src="js/carrito-vista.js"></script>
    <script src="js/layout.js"></script>
</body>

</html>
