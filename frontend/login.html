<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión — HuertoHogar</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body data-page="login">
    <div data-parcial="header"></div>

    <!-- novalidate apaga la validación nativa del navegador a propósito: la EV1
         pide "validaciones mediante JavaScript", así que quien decide es
         validaciones.js y no el <input type="email">. -->
    <main class="formulario-pagina">
        <h1>Iniciar sesión</h1>
        <p class="txt-secundario">Ingresa con el correo y la contraseña que registraste.</p>

        <form class="formulario" id="form-login" novalidate>
            <p class="form-mensaje" id="login-mensaje" role="status"></p>

            <div class="campo">
                <label for="login-email">Correo electrónico</label>
                <input type="email" id="login-email" name="email" autocomplete="email"
                    aria-describedby="error-login-email">
                <p class="error" id="error-login-email"></p>
            </div>

            <div class="campo">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" name="password" autocomplete="current-password"
                    aria-describedby="error-login-password">
                <p class="error" id="error-login-password"></p>
            </div>

            <button type="submit" class="btn btn-primary">Entrar</button>
            <p class="form-pie">¿Todavía no tienes cuenta? <a href="registro.html">Crea una acá</a>.</p>
        </form>
    </main>

    <div data-parcial="footer"></div>

    <script src="js/carrito.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/layout.js"></script>
</body>

</html>
