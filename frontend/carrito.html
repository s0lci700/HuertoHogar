<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrito — HuertoHogar</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body data-page="carrito">
    <div data-parcial="header"></div>

    <main class="container">
    <div class="row">
      <div class="col-8">
        <h1>Productos disponibles</h1>
        <div id="grid-productos" class="grid-productos">
           <!-- Los productos se cargarán aquí con JavaScript -->
        </div>
      </div><!-- .col-8-->

      <div class="col-4"> 
        <h2>🛒 Carrito</h2>
        <ul id="lista-carrito" class="carrito-lista">
          <!-- Los items del carrito se mostrarán aquí -->
        </ul>

        <!-- renderizarCarrito() muestra este párrafo y esconde #resumen-carrito
             cuando el carrito está vacío, y al revés cuando tiene items. -->
        <p id="carrito-vacio">Tu carrito está vacío.</p>

        <div id="resumen-carrito" class="carrito-resumen">
          <p class="carrito-total">Total: <span id="total-carrito">0</span></p>
          <!-- TODO: botón "Confirmar pedido" -->
        </div>

        <button id="btn-vaciar">Vaciar Carrito</button>
      </div> <!-- .col-4 -->
    </div><!-- .row -->
    </main>

    <div data-parcial="footer"></div>

    <script src="js/carrito.js"></script>
    <script src="js/carrito-vista.js"></script>
    <script src="js/layout.js"></script>
</body>

</html>
