<!DOCTYPE html>
<html lang="es">

<head>

    <link rel="stylesheet" href="css/main.css">
</head>

<body data-page="index">
    <div data-parcial="header"></div>

    <main>
        <section class="hero">
            <div class="container hero-inner">
                <p class="eyebrow">Del campo a tu hogar</p>

            <h2 id="titulo-categorias">Categorías destacadas</h2>

    <div data-parcial="footer"></div>

    <script src="js/carrito.js"></script>
